<script>
/* 追加ファイル: bgm_start.mp3 bgm_chase.mp3 key2.mp3 locked.mp3 door.mp3 scare.mp3 voice.mp3 wrong.mp3 caught.mp3 caught.gif intro.mp4 revenge.mp4 (無ければ内蔵の音・演出) */
const SENS=()=>.15+VOL.sens/50*.85;

(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),i=g.createImageData(128,128);for(let k=0;k<i.data.length;k+=4){i.data[k]=i.data[k+1]=i.data[k+2]=Math.random()*255;i.data[k+3]=255}g.putImageData(i,0,0);$('grain').style.backgroundImage='url('+c.toDataURL()+')'})();
scene.add(new THREE.HemisphereLight(0x3a4466,0x120a05,.4));
const torch=new THREE.SpotLight(0xffe7c4,2.4,24,Math.PI/6,.45,1.3);torch.position.set(0,0,0);torch.target.position.set(0,0,-1);

const AU=n=>{const a=new Audio(n+'.mp3');a.addEventListener('error',()=>{if(!/\.wav$/.test(a.src)){a.src=n+'.wav';a.load()}});return a};

applyVol();

 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type=type;f.frequency.value=freq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(sx);s.start()}

let drone2On=false;function drone2(){if(drone2On)return;drone2On=true;const a=actx(),o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain(),lp=a.createBiquadFilter();o.type='square';o.frequency.value=98;g.gain.value=.025;l.frequency.value=3.2;lg.gain.value=.025;l.connect(lg);lg.connect(g.gain);lp.type='lowpass';lp.frequency.value=260;o.connect(lp);lp.connect(g);g.connect(bg);o.start();l.start()}
function setBgm(w){if(bgmCur===w)return;const a=w==='B'?bgmB:bgmA,b=w==='B'?bgmA:bgmB;b.pause();bgmCur=w;a.currentTime=0;a.play().catch(()=>{drone();if(w==='B')drone2()})}
function startAudio(){actx();bgmMute=false;setBgm(S.phase>=1?'B':'A')}
function playSnd(k,fb){const a=SND[k];a.currentTime=0;a.play().catch(fb||(()=>{}))}
const sfx=n=>[0,()=>noise(.1,.4,2000,'highpass'),()=>noise(.45,.25,350,'bandpass'),()=>noise(.25,.3,3000,'highpass')][n]();
function scareSound(){scareA.currentTime=0;scareA.play().catch(()=>{noise(1.2,.9,2500,'bandpass');noise(.5,.8,120)})}
function voice(t,big){cap(t);voiceA.currentTime=0;voiceA.play().catch(()=>growl(big?.8:.3))}
let ct,mt;function cap(t){const e=$('cap');e.textContent=t;e.style.opacity=1;clearTimeout(ct);ct=setTimeout(()=>e.style.opacity=0,2600)}

/* ===== 素材 ===== */
const M=(c,e)=>new THREE.MeshStandardMaterial({color:c,roughness:.85,emissive:e||0});
function tex2(kind,rx,ry){const N=256,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
 if(kind==='wall'){g.fillStyle='#2a2420';g.fillRect(0,0,N,N);for(let y=0;y<8;y++)for(let x=0;x<4;x++){const o=y%2?32:0,v=70+Math.random()*30|0;g.fillStyle=`rgb(${v+15},${v},${v-12})`;g.fillRect(x*64+o+2,y*32+2,60,28)}}
 else{g.fillStyle='#1a120c';g.fillRect(0,0,N,N);for(let i=0;i<8;i++){const v=50+Math.random()*25|0;g.fillStyle=`rgb(${v+10},${v-8},${v-20})`;g.fillRect(0,i*32+1,N,30);g.fillStyle='rgba(0,0,0,.6)';g.fillRect((i*97)%N,i*32,2,32)}}
 for(let i=0;i<500;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.2})`;g.fillRect(Math.random()*N,Math.random()*N,Math.random()*14+1,Math.random()*14+1)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=ren.capabilities.getMaxAnisotropy();return t}
const mk=(k,rx,ry,b)=>{const t=tex2(k,rx,ry);return new THREE.MeshStandardMaterial({map:t,bumpMap:t,bumpScale:b,roughness:.9})};
const WL=mk('wall',2,1,2),RW=new THREE.MeshStandardMaterial({color:0x3a3a3f,roughness:1}),WD=M(0x4a2f1c);
const winT=(()=>{const c=document.createElement('canvas');c.width=128;c.height=96;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,96);gr.addColorStop(0,'#0b1330');gr.addColorStop(1,'#1d2a4a');g.fillStyle=gr;g.fillRect(0,0,128,96);
 g.fillStyle='rgba(232,238,255,.15)';g.beginPath();g.arc(92,24,19,0,7);g.fill();g.fillStyle='#e8eeff';g.beginPath();g.arc(92,24,9,0,7);g.fill();
 g.fillStyle='#050a10';for(let i=0;i<14;i++){const x=i*10+Math.random()*6,h=30+Math.random()*30;g.beginPath();g.moveTo(x-8,96);g.lineTo(x,96-h);g.lineTo(x+8,96);g.fill()}
 const t=new THREE.CanvasTexture(g.canvas);t.encoding=THREE.sRGBEncoding;return t})();
const faceT=(()=>{const c=document.createElement('canvas');c.width=64;c.height=80;const g=c.getContext('2d');g.fillStyle='#1b1410';g.fillRect(0,0,64,80);g.fillStyle='#b8a898';g.beginPath();g.ellipse(32,38,16,22,0,0,7);g.fill();g.fillStyle='#000';g.fillRect(23,32,6,8);g.fillRect(36,32,6,8);g.fillRect(27,52,12,2);

const WM=new THREE.MeshBasicMaterial({map:winT}),FM=M(0x1a0f08),PM=new THREE.MeshStandardMaterial({map:faceT,roughness:1});

/* ===== フロア構築ヘルパー ===== */
const FL=[];
function mkF(W,D,wm,fx){const g=new THREE.Group();g.visible=false;scene.add(g);
 const fm=mk('floor',W/2,D/2,1.5),f=new THREE.Mesh(new THREE.PlaneGeometry(W,D),fm);f.rotation.x=-Math.PI/2;f.position.set(W/2,0,D/2);f.receiveShadow=true;g.add(f);
 const c=new THREE.Mesh(new THREE.PlaneGeometry(W,D),M(0x1c1814));c.rotation.x=Math.PI/2;c.position.set(W/2,H,D/2);g.add(c);
 const o={g,W,D,wm,col:[],wcol:[],doors:[],ints:[],nav:null};FL.push(o);return o}
function B(o,x,y,z,w,h,d,m,col=1){const e=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof m==='number'?M(m):m);e.position.set(x,y+h/2,z);e.castShadow=e.receiveShadow=true;o.g.add(e);
 if(col){const r=[x-w/2,z-d/2,x+w/2,z+d/2];o.col.push(r);if(col===2)o.wcol.push(r)}return e}
const LM={k2f:'この扉には鍵がかかっている。',kb:'地下への扉は固く閉ざされている。',ev:'扉はびくともしない…。今は開かない。'};
const has=k=>k==='ev'?S.ev:S.items.includes(k),unl=d=>S.ul[d.id]||(d.k==='ev'&&S.ev);
function wl(o,ax,c,a,b,gaps=[],m){m=m||o.wm;let p=a;const seg=(s,e)=>{if(e-s<.01)return;ax==='h'?B(o,(s+e)/2,0,c,e-s,H,.2,m,2):B(o,c,0,(s+e)/2,.2,H,e-s,m,2)};
 for(const[ct,w=2,k]of[...gaps].sort((x,y)=>x[0]-y[0])){seg(p,ct-w/2);p=ct+w/2;if(k!=='arch')mkDoor(o,ax,c,ct,w,k)}seg(p,b)}
function mkDoor(o,ax,c,ct,w,k){const h=ax==='h',piv=new THREE.Group(),pn=new THREE.Mesh(new THREE.BoxGeometry(h?w-.06:.08,2.4,h?.08:w-.06),M(0x4b2f1c));
 pn.castShadow=true;pn.position.set(h?w/2:0,1.2,h?0:w/2);piv.add(pn);const kn=new THREE.Mesh(new THREE.SphereGeometry(.05),M(0xc9a24a));kn.position.set(h?w-.2:.07,1.1,h?.07:w-.2);piv.add(kn);
 piv.position.set(h?ct-w/2:c,0,h?c:ct-w/2);o.g.add(piv);const x=h?ct:c,z=h?c:ct;
 const d={x,z,h,k,piv,open:false,id:o.g.id+':'+ct+':'+c,col:h?[ct-w/2,c-.15,ct+w/2,c+.15]:[c-.15,ct-w/2,c+.15,ct+w/2]};o.doors.push(d);
 o.ints.push({x,z,r:1.6,lab:()=>d.k&&!unl(d)?(has(d.k)?'鍵を使う':'鍵がかかっている'):(d.open?'扉を閉める':'扉を開ける'),
  fn:()=>{if(d.k&&!unl(d)){if(!has(d.k)){say(LM[d.k]);playSnd('locked',()=>sfx(2));return}S.ul[d.id]=1;sfx(1);if(d.k!=='ev')useKey(d.k)}d.open=!d.open;piv.rotation.y=d.open?(h?-1.5:1.5):0;d.open?playSnd('door',()=>sfx(2)):sfx(2)}})}
function win(o,x,z,ax,s){const f=ax==='h',m=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.2),WM);m.position.set(f?x:x+s*.11,1.7,f?z+s*.11:z);m.rotation.y=f?(s>0?0:Math.PI):(s>0?Math.PI/2:-Math.PI/2);o.g.add(m);
 const bar=(w,h)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(f?w:.04,h,f?.04:w),FM);b.position.set(f?x:x+s*.115,1.7,f?z+s*.115:z);o.g.add(b)};bar(1.7,.06);bar(.06,1.3)}
function portrait(o,x,z,ax,s,y=1.7){const m=new THREE.Mesh(new THREE.PlaneGeometry(.6,.75),PM),f=ax==='h';m.position.set(f?x:x+s*.11,y,f?z+s*.11:z);m.rotation.y=f?(s>0?0:Math.PI):(s>0?Math.PI/2:-Math.PI/2);o.g.add(m)}
function light(o,c,i,d,x,y,z){const l=new THREE.PointLight(c,i,d);l.position.set(x,y,z);o.g.add(l)}

$('bRev').onclick=()=>{$('choice').style.display='none';revMovie(()=>showEnd('復讐','復讐を終えた少年は、血のついた包丁を床に落とした。<br>僕は、警察に自首した。<br>両親のいない世界で、生きる理由を見つけられなかった僕は、その夜、自ら命を絶った。'))};
function revMovie(cb){const j=$('jump'),rv=$('rv'),cv=$('jcv'),c=cv.getContext('2d');let fin=false,anim=false;$('jimg').style.display='none';j.style.display='block';bgm.pause();
 const end=()=>{if(fin)return;fin=true;rv.pause();rv.style.display='none';j.style.display='none';j.onclick=null;cb()};j.onclick=end;
 const run=()=>{if(anim||fin)return;anim=true;rv.style.display='none';cv.style.display='block';cv.width=innerWidth/2|0;cv.height=innerHeight/2|0;const t0=performance.now(),w=cv.width,h=cv.height,fy=h*.78;let snd=false;
  const T=[[0,'玄関へ向かう途中、廊下の先にあの男の背中があった。'],[3,'僕は、母の包丁を握りしめた。'],[5.6,'…終わりだ。'],[8,'']];
  (function f(){if(fin)return;const t=(performance.now()-t0)/1000;if(t>10.5){end();return}
   c.fillStyle='#3d1f1f';c.fillRect(0,0,w,h);c.fillStyle='#1c0e0e';c.fillRect(0,fy,w,h-fy);
   const mx=w*.62,k=Math.max(0,Math.min(1,(t-3.2)/2.3)),bx=w*(.12+.42*k),hit=t>5.6;
   c.fillStyle='#000';c.save();c.translate(mx,fy);if(hit)c.rotate(Math.min(1,(t-5.8)/1.3)*1.45);c.fillRect(-w*.03,-h*.3,w*.06,h*.3);c.beginPath();c.arc(0,-h*.34,h*.045,0,7);c.fill();c.restore();
   c.save();c.translate(bx+(hit?Math.sin(t*30)*1.2:0),fy);c.fillRect(-w*.02,-h*.18,w*.04,h*.18);c.beginPath();c.arc(0,-h*.21,h*.03,0,7);c.fill();c.fillStyle='#cfd6dc';c.fillRect(w*.02,-h*.15,w*.05,h*.012);c.restore();
   if(hit){if(!snd){snd=true;noise(.4,.8,200);noise(.8,.5,3000,'highpass')}const q=Math.min(1,(t-5.6)/.5);c.strokeStyle='rgba(170,0,0,.9)';c.lineWidth=3;for(let i=0;i<14;i++){const a=i/14*6.28,r=q*h*(.12+(i%3)*.05);c.beginPath();c.moveTo(mx,fy-h*.18);c.lineTo(mx+Math.cos(a)*r,fy-h*.18+Math.sin(a)*r*.8);c.stroke()}
    c.fillStyle='rgba(120,0,0,.9)';c.beginPath();c.ellipse(mx+w*.05,fy+h*.04,Math.min(1,(t-6.3)/2.5)*w*.18,h*.035,0,0,7);c.fill()}
   if(t>5.6&&t<5.75){c.fillStyle='rgba(255,255,255,.85)';c.fillRect(0,0,w,h)}
   if(t>8.5){c.fillStyle='rgba(0,0,0,'+Math.min(1,(t-8.5)/2)+')';c.fillRect(0,0,w,h)}
   let cp='';for(const[ts,tx]of T)if(t>=ts)cp=tx;c.fillStyle='#d9c9ba';c.font=(h*.06|0)+'px serif';c.textAlign='center';c.fillText(cp,w/2,h*.93);requestAnimationFrame(f)})()};
 rv.style.display='block';cv.style.display='none';rv.onended=end;rv.onerror=run;rv.volume=VOL.m/100;rv.src='revenge.mp4';rv.play().catch(run)}
function newGame(){S=fresh();SAVE=JSON.stringify(S);applyS();ov.style.display='none';if(!touch)ren.domElement.requestPointerLock();actx();playIntro()}
function cont(){S=JSON.parse(ls.get('haioku_escape_save'));S.pp=S.pp||pickPP();SAVE=JSON.stringify(S);applyS();const c=S.cp;tp(c.fl,c.x,c.z,c.yaw);introDone=true;ov.style.display='none';if(!touch)ren.domElement.requestPointerLock();startAudio();playing=true;E.sp=6}

/* ===== オープニング ===== */
let cardsOn=false,done=false,cardTimer;const intro=$('intro'),card=$('card');
const CARDS=['10歳の誕生日。\n三人家族、はじめての海外旅行。','お金の都合で選んだのは、\n離れにある安い別荘だった。','そこは「幽霊が出る」と噂の家。','だが、幽霊などいなかった。\n住んでいたのは、指名手配犯。','異変に気づいたとき、\n父はもう動かなかった。','母は私を抱えて逃げようとして…','玄関には鍵がかかっている。\n2階の部屋に隠れ、鍵を探さなければ。'];
function playIntro(){intro.style.display='flex';$('skip').onclick=endIntro;pv.style.display='block';pv.onended=endIntro;pv.onerror=cards;pv.src='intro.mp4';pv.play().catch(cards)}
function cards(){if(cardsOn||done)return;cardsOn=true;pv.style.display='none';startAudio();let i=0;
 const next=()=>{if(done)return;if(i>=CARDS.length){endIntro();return}card.style.opacity=0;setTimeout(()=>{card.innerHTML=CARDS[i++].replace(/\n/g,'<br>');card.style.opacity=1},600);cardTimer=setTimeout(next,4300)};next()}
function endIntro(){if(done)return;done=true;clearTimeout(cardTimer);pv.pause();intro.style.display='none';introDone=true;tp(2,2.5,3.6,Math.PI);if(!cardsOn)startAudio();playing=true;say('2階の部屋に隠れた。玄関の鍵を探さなければ…',4500)}

/* ===== 入力 ===== */
const kd={};let mv={x:0,y:0},sId=null,lId=null,sO,lP,act=null;
addEventListener('keydown',e=>{kd[e.code]=true;if(padOpen){if(/^(Digit|Numpad)\d$/.test(e.code))padKey(e.key);else if(e.code==='Backspace')padKey('del');else if(e.code==='Enter')padKey('ok');else if(e.code==='Escape')closePad();return}if(e.code==='KeyE'){if(noteOpen)closeNote();else if(playing&&act)act.fn()}});addEventListener('keyup',e=>kd[e.code]=false);
document.addEventListener('pointerlockchange',()=>{if(!touch&&!document.pointerLockElement&&playing&&!choosing&&!noteOpen)pauseMenu()});
addEventListener('mousemove',e=>{if(!playing||touch||!document.pointerLockElement)return;yaw-=e.movementX*.0022*SENS();pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0022*SENS()))});
$('ib').onclick=()=>{if(noteOpen)closeNote();else if(playing&&act)act.fn()};$('gear').onclick=pauseMenu;
if(touch){$('ib').style.display=$('gear').style.display='block'}
addEventListener('touchstart',e=>{if(!playing||e.target.closest('button'))return;for(const t of e.changedTouches){
 if(t.clientX<innerWidth/2&&sId===null){sId=t.identifier;sO={x:t.clientX,y:t.clientY};const k=$('knob');k.style.display='block';k.style.left=t.clientX-35+'px';k.style.top=t.clientY-35+'px'}
 else if(t.clientX>=innerWidth/2&&lId===null){lId=t.identifier;lP={x:t.clientX,y:t.clientY}}}},{passive:false});
addEventListener('touchmove',e=>{if(e.target.type==='range')return;e.preventDefault();for(const t of e.changedTouches){
 if(t.identifier===sId){let dx=(t.clientX-sO.x)/50,dy=(t.clientY-sO.y)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}mv={x:dx,y:dy};$('knob').style.left=sO.x+dx*35-35+'px';$('knob').style.top=sO.y+dy*35-35+'px'}
 if(t.identifier===lId){yaw-=(t.clientX-lP.x)*.006*SENS();pitch=Math.max(-1.2,Math.min(1.2,pitch-(t.clientY-lP.y)*.006*SENS()));lP={x:t.clientX,y:t.clientY}}}},{passive:false});
const tend=e=>{for(const t of e.changedTouches){if(t.identifier===sId){sId=null;mv={x:0,y:0};$('knob').style.display='none'}if(t.identifier===lId)lId=null}};addEventListener('touchend',tend);addEventListener('touchcancel',tend);

/* ===== メインループ ===== */
function scan(){if(hid)return{lab:()=>'出る',fn:unhide};let best=null,bd=1e9;for(const a of FL[cur].ints){if(a.ok&&!a.ok())continue;const d=Math.hypot(a.x-pos.x,a.z-pos.z);if(d<a.r&&d<bd){bd=d;best=a}}return best}
function ambient(dt){if(S.phase!==0||cur===2&&false)return;ambT-=dt;if(ambT<=0){ambT=12+Math.random()*14;for(let i=0;i<4;i++)setTimeout(()=>noise(.2,.35,150),i*620);if(Math.random()<.5)setTimeout(()=>voice(LINES[Math.floor(Math.random()*4)]),1500)}}
const mc=$('mm').getContext('2d');if(touch)$('mm').style.top='52px';
const ROOMS=[[['廊下',12,6.6],['赤い部屋',10,3.4],['奥の部屋',19,3.4]],[['居間',4,3],['キッチン',12,3],['廊下',8,7.5],['寝室',3,11.5],['玄関',8,12.6],['書斎',13,12.8]],[['寝室A',2.5,2.5],['部屋B',8,2.5],['鍵の部屋',13.5,2.5],['廊下',8,6.5]]];
const STR=[[[2.4,6.5,'↑1F']],[[2.4,7.5,'↑2F'],[15,7.5,'↓B1']],[[14.8,6.6,'↓1F']]];
function drawMM(){const o=FL[cur],k=140/Math.max(o.W,o.D),ox=5+(140-o.W*k)/2,oy=5+(140-o.D*k)/2;mc.clearRect(0,0,150,150);mc.fillStyle='rgba(0,0,0,.5)';mc.fillRect(0,0,150,150);
 mc.fillStyle='#8a7a6a';for(const a of o.wcol)mc.fillRect(ox+a[0]*k,oy+a[1]*k,Math.max(1.5,(a[2]-a[0])*k),Math.max(1.5,(a[3]-a[1])*k));
 for(const d of o.doors)if(!d.open){mc.fillStyle=d.k&&!unl(d)?'#c33':'#b5651d';mc.fillRect(ox+d.x*k-3,oy+d.z*k-3,6,6)}
 mc.font='9px sans-serif';mc.textAlign='center';mc.fillStyle='#d9c9ba';for(const r of ROOMS[cur])mc.fillText(r[0],ox+r[1]*k,oy+r[2]*k);
 mc.fillStyle='#ffd070';for(const r of STR[cur])mc.fillText(r[2],ox+r[0]*k,oy+r[1]*k);
 mc.save();mc.translate(ox+pos.x*k,oy+pos.z*k);mc.rotate(Math.atan2(-Math.cos(yaw),-Math.sin(yaw)));mc.fillStyle='#4f4';mc.beginPath();mc.moveTo(6,0);mc.lineTo(-4,-4);mc.lineTo(-4,4);mc.fill();mc.restore();
 const g=!S.taken.k2f?'目的: 2階の机の引き出しを調べよう':!S.taken.kb?'目的: 1階のキッチンで鍵を探そう':!S.ev?'目的: 地下室を調べよう':!S.taken.kf&&!S.ul.kf?'目的: 地下の奥の部屋で玄関の鍵を探そう':!S.ul.code?'目的: 4枚の紙から暗証番号を探し、玄関へ':'目的: 玄関から脱出しよう';if($('goal').textContent!==g)$('goal').textContent=g}
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,o=FL[cur];
 if(playing){
  if(!hid){let fx=0,fz=0;if(touch){fx=mv.x;fz=-mv.y}else{fx=(kd.KeyD?1:0)-(kd.KeyA?1:0);fz=(kd.KeyW||kd.ArrowUp?1:0)-(kd.KeyS||kd.ArrowDown?1:0)}
   const l=Math.hypot(fx,fz);if(l>0){const n=l>1?1/l:1,sp=3.2*dt;fx*=n;fz*=n;const dx=(-Math.sin(yaw)*fz+Math.cos(yaw)*fx)*sp,dz=(-Math.cos(yaw)*fz-Math.sin(yaw)*fx)*sp;
    if(!blk(o,pos.x+dx,pos.z))pos.x+=dx;if(!blk(o,pos.x,pos.z+dz))pos.z+=dz;stepT+=dt*Math.min(l,1);if(stepT>.5){stepT=0;noise(.12,.12,380)}}}
  act=scan();$('pr').textContent=act?(touch?act.lab():'[E] '+act.lab()):'';$('ib').textContent=act?act.lab():'調べる';$('ib').style.opacity=act?1:.35;
  updE(dt);ambient(dt);
  if(S.phase>=1&&(cur===1||cur===2&&S.roam||cur===0&&S.enc&&S.ev)&&!E.on&&!evPlaying&&!choosing&&!padOpen&&!noteOpen){E.sp-=dt;if(E.sp<=0)spawnE()}
 }else $('pr').textContent='';
 for(const k in PK)if(PK[k].visible&&k!=='kn'&&!/^n\d/.test(k)){PK[k].rotation.y+=dt*2}
 if(introDone&&!bgmMute){const w=S.phase>=1?'B':'A';if(bgmCur!==w)setBgm(w)}
 for(const c of CABS)c.piv.rotation.y+=((c.open?-1.7:0)-c.piv.rotation.y)*Math.min(1,dt*7);
 for(const k in S.pp){const id=S.pp[k],sp=SPOT[k];if(sp&&PK[id])PK[id].visible=!S.taken[id]&&(sp.type==='bed'||sp.c.open)}
 let inten=2.4+Math.sin(t*9)*.05+(Math.random()<.02?-.8:0);if(flick>0){flick-=dt;inten=Math.random()<.5?0:3.5}torch.intensity=Math.max(0,inten);
 let sx=0,sy=0;if(shake>0){shake-=dt;sx=(Math.random()-.5)*.04;sy=(Math.random()-.5)*.04}
 camY+=((hid?hid.cy:1.6)-camY)*Math.min(1,dt*6);const bob=playing&&!hid&&(mv.x||mv.y||kd.KeyW||kd.KeyS||kd.KeyA||kd.KeyD)?Math.sin(t*9)*.03:0;
 cam.position.set(pos.x,camY+bob,pos.z);cam.rotation.set(pitch+sy,yaw+sx,0);
 for(const d of DRS)d.g.position.z+=((S[d.flag]?d.z0+.5:d.z0)-d.g.position.z)*Math.min(1,dt*5);drawMM();
 ren.render(scene,cam)}
FL[cur].g.visible=true;hudItems();titleMenu();loop();
